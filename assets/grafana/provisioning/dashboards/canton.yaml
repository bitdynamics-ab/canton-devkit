# BIT-134 — Grafana dashboard provisioning. Loads the canton-localnet
# dashboard JSON at boot so users land on a useful view without
# clicking through Grafana's import flow.
apiVersion: 1
providers:
  - name: canton-localnet
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
