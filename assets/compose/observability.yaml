# Observability profile overlay.
#
# Apply via `docker compose -f <splice-base.yaml> -f observability.yaml up`
# OR via `dpm localnet up --profile observability` which wires the
# overlay automatically.
#
# Goals:
#   - opt-in: default off so the ~600 MiB overhead doesn't hit users
#     who don't need metrics.
#   - per-instance: each LocalNet gets its own Prometheus + Grafana
#     so two instances don't contend on the same scrape config.
#   - loopback-only host bind: Grafana is published only to
#     127.0.0.1 — matches the Web UI's "no LAN exposure" posture.
#
# Service contracts:
#   prometheus → scrapes canton/splice JMX + admin metrics endpoints
#                exposed by the base compose. Splice publishes
#                `/metrics` on each participant's admin port — the
#                scrape config below targets those internal addrs.
#   grafana    → provisioned at boot with the canton-localnet
#                dashboard from assets/grafana/dashboards/.

services:
  prometheus:
    # Activated by either the umbrella `observability` profile or the
    # per-component `prometheus` profile. Splitting lets users enable
    # metrics scraping without paying Grafana's image + RAM overhead
    # (or vice versa — Grafana pointed at an external Prometheus).
    profiles: ["observability", "prometheus"]
    image: prom/prometheus:v3.0.1
    container_name: ${COMPOSE_PROJECT_NAME:-canton}-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      # NB: paths are relative to this compose file's directory
      # (assets/compose/). prometheus.yml is a sibling.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Bind explicitly to 127.0.0.1 — no LAN exposure.
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - default

  grafana:
    # Per-component profile (`grafana`) plus the umbrella so legacy
    # `--profile observability` keeps starting both services.
    profiles: ["observability", "grafana"]
    image: grafana/grafana:11.4.0
    container_name: ${COMPOSE_PROJECT_NAME:-canton}-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Anonymous viewer access — Grafana is loopback-only so this
      # is safe; spares the user a login prompt on a dev tool.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Disable the welcome banner / news widget on the home page.
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      # Provisioning + dashboards live at assets/grafana/ (one level up
      # from this compose file at assets/compose/).
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    networks:
      - default
