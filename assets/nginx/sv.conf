# canton-devkit: server_name values are instance-scoped vhosts of the form
# <service>.<localnet-name>.localhost, injected via ${VHOST_*} env vars by
# WriteNginxVhostOverlay (e.g. wallet.localnet-2.localhost). The flat Splice
# names (wallet.localhost, scan.localhost, sv.localhost, ...) are
# intentionally NOT served — DevKit advertises only the instance-scoped
# names so URLs stay unambiguous across concurrently running localnets.
#
# NOTE: *.localhost resolves to 127.0.0.1 in browsers, curl, and Go, but NOT
# in the JVM/Node/Python resolvers (and some Rust HTTP clients). Programmatic
# clients on those runtimes must send an explicit `Host:` header (HTTP) or
# `:authority:` pseudo-header (gRPC), or add an /etc/hosts entry.
server {
  listen ${SV_UI_PORT};
  # Catch-all default server: keeps the stub_status endpoint reachable and
  # absorbs unmatched Host headers. `_` (not `localhost`) so the bare host
  # URL does not fall through to the non-existent /usr/share/nginx/sv-html
  # static dir (which 404'd before PR #279).
  server_name _;

  location = /status {
    stub_status;
  }

  # Serve static files from /usr/share/nginx/html
  location / {
    root /usr/share/nginx/sv-html;
    try_files $uri $uri/ =404;
  }

  client_max_body_size 10M;
  keepalive_timeout 65;
}

server {
  listen ${SV_UI_PORT};
  server_name ${VHOST_SV};

  location /api/sv {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5014/api/sv;
  }
  location / {
    proxy_pass http://sv-web-ui:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name ${VHOST_SCAN};

  location /api/scan {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5012/api/scan;
  }
  location /registry {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5012/registry;
  }
  location / {
    proxy_pass http://scan-web-ui:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name ${VHOST_WALLET};

  # Reverse proxy for /api/validator
  location /api/validator {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:4${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }

  # Reverse proxy to wallet-web-ui
  location / {
    proxy_pass http://wallet-web-ui-sv:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name canton.localhost;
  location /docs/openapi {
    proxy_pass http://canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}/docs/openapi;
    include /etc/nginx/includes/cors-headers.conf;
  }

  location /v2 {
    include /etc/nginx/includes/cors-options-headers.conf;
    proxy_pass http://canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}/v2;
    include /etc/nginx/includes/cors-headers.conf;
  }
}
