server {
  listen ${SV_UI_PORT};
  # canton-devkit: dropped `localhost` from this catch-all. Upstream had
  # `server_name localhost _;` which claimed the bare host URL DevKit
  # advertises (http://localhost:${SV_UI_PORT}) and tried to serve a static
  # dir (/usr/share/nginx/sv-html) that does not exist in the image, so the
  # sv wallet URL 404'd. `_` alone keeps the status/CORS default server.
  server_name _;

  location = /status {
    stub_status;
  }

  # Serve static files from /usr/share/nginx/html
  location / {
    root /usr/share/nginx/sv-html;
    try_files $uri $uri/ =404;
  }

  client_max_body_size 10M;
  keepalive_timeout 65;
}

server {
  listen ${SV_UI_PORT};
  server_name sv.localhost;

  location /api/sv {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5014/api/sv;
  }
  location / {
    proxy_pass http://sv-web-ui:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name scan.localhost;

  location /api/scan {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5012/api/scan;
  }
  location /registry {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:5012/registry;
  }
  location / {
    proxy_pass http://scan-web-ui:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  # canton-devkit: `localhost` added so the bare host URL DevKit advertises
  # (http://localhost:${SV_UI_PORT}) routes to the sv wallet instead of the
  # static catch-all above.
  server_name localhost wallet.localhost;

  # Reverse proxy for /api/validator
  location /api/validator {
    rewrite ^\/(.*) /$1 break;
    proxy_pass http://splice:4${VALIDATOR_ADMIN_API_PORT_SUFFIX}/api/validator;
  }

  # Reverse proxy to wallet-web-ui
  location / {
    proxy_pass http://wallet-web-ui-sv:8080/;
  }
}

server {
  listen ${SV_UI_PORT};
  server_name canton.localhost;
  location /docs/openapi {
    proxy_pass http://canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}/docs/openapi;
    include /etc/nginx/includes/cors-headers.conf;
  }

  location /v2 {
    include /etc/nginx/includes/cors-options-headers.conf;
    proxy_pass http://canton:4${PARTICIPANT_JSON_API_PORT_SUFFIX}/v2;
    include /etc/nginx/includes/cors-headers.conf;
  }
}
