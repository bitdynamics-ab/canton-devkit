name: CI

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "docs/design/mockups/**.jsx"
      - "frontend/**"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "docs/design/mockups/**.jsx"
      - "frontend/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  mockup-syntax:
    # PR #31 #10 review pin: docs/design/mockups/*.jsx are
    # acceptance specs. CI doesn't render them, but we syntax-
    # check each file so a hand-edit that breaks the design-
    # canvas viewer fails here rather than in a reviewer's
    # browser.
    #
    # The original `node --check` approach was wrong — vanilla
    # Node can't parse JSX (the `<` operator at expression
    # position is a syntax error). Replaced with esbuild, which
    # is fast (single binary, ~10MB), JSX-native, and produces
    # the same exit-code signal we want from a syntax check.
    # `--bundle=false` keeps it as a parse-only pass; output
    # routed to /dev/null since we never use the transpiled JS.
    name: Mockup JSX syntax
    runs-on: [self-hosted, Linux]
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node
        # actions/setup-node@v4 — self-hosted runners don't ship
        # with npm; same pin as the frontend job.
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version-file: frontend/.nvmrc
      - name: Esbuild syntax-check every mockup .jsx
        run: |
          set -euo pipefail
          # --no-save: don't write package.json; --silent:
          # keep CI output focused on the syntax errors only.
          npm install --no-save --silent esbuild@0.23.1
          # esbuild auto-detects JSX from the .jsx extension; the
          # --loader=jsx flag is stdin-only and errors on file
          # inputs.
          for f in docs/design/mockups/*.jsx; do
            ./node_modules/.bin/esbuild --log-level=error "$f" \
              > /dev/null \
              || { echo "::error file=$f::JSX syntax error"; exit 1; }
          done

  lint:
    name: Lint
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        # golangci/golangci-lint-action@v9.2.0
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.12.2

  frontend:
    # Frontend lint + typecheck + Vitest suite. Gated on
    # frontend/** + Makefile path filters above, so a Go-only
    # change doesn't pay the npm-install cost.
    #
    # Deliberately does NOT run `npm run build` — the production
    # bundle goes through `make frontend` at release time
    # (release.yml), which also runs `go build` and proves
    # //go:embed picks it up. This job is the per-PR fast loop:
    # tsc + vitest, ~30s on a warm runner.
    name: Frontend test
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node
        # actions/setup-node@v4
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck
        run: cd frontend && npm ci --silent && npm run typecheck

      - name: Test
        run: cd frontend && npm test
