name: CI

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "docs/design/mockups/**.jsx"
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "docs/design/mockups/**.jsx"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  mockup-syntax:
    # PR #31 #10 review pin: docs/design/mockups/*.jsx are
    # acceptance specs. CI doesn't render them, but `node --check`
    # parses each file so a hand-edit that breaks the design-
    # canvas viewer fails here rather than in a reviewer's
    # browser.
    name: Mockup JSX syntax
    runs-on: [self-hosted, Linux]
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Node --check every mockup .jsx
        run: |
          set -euo pipefail
          for f in docs/design/mockups/*.jsx; do
            node --check "$f" || { echo "::error file=$f::JSX syntax error"; exit 1; }
          done

  lint:
    name: Lint
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        # golangci/golangci-lint-action@v9.2.0
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.12.2
