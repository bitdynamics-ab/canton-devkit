name: CI

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "install.sh"
      - "docs/design/mockups/**.jsx"
      - "frontend/**"
      - "Makefile"
      # Guarded artifacts whose tests only run when the Go suite runs:
      # skill docs (TestSkillsLint_AgainstLiveCobraSurface), the DPM
      # component template (packaging/component_test.go), and the
      # copy-pasteable CI examples. A doc-only edit that breaks a flag
      # reference used to merge with zero CI; these patterns close that.
      - "internal/skills/docs/**"
      - "packaging/**"
      - "examples/**"
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/ci.yml"
      - "install.sh"
      - "docs/design/mockups/**.jsx"
      - "frontend/**"
      - "Makefile"
      # Keep in sync with the pull_request paths above: skill docs,
      # the DPM component template, and the CI examples are all guarded
      # by Go tests that otherwise never run on a doc-only push.
      - "internal/skills/docs/**"
      - "packaging/**"
      - "examples/**"

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: [self-hosted, Linux]
    outputs:
      go: ${{ steps.filter.outputs.go }}
      install_sh: ${{ steps.filter.outputs.install_sh }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mockups: ${{ steps.filter.outputs.mockups }}
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Filter changed paths
        # dorny/paths-filter@v4.0.2
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'internal/skills/docs/**'
              - 'packaging/**'
              - '.github/workflows/ci.yml'
            install_sh:
              - 'install.sh'
            frontend:
              - 'frontend/**'
              - 'Makefile'
            mockups:
              - 'docs/design/mockups/**.jsx'

  go:
    name: Build, lint, and test
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.install_sh == 'true'
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate install.sh syntax
        if: needs.changes.outputs.install_sh == 'true'
        run: sh -n install.sh

      - name: Run golangci-lint
        if: needs.changes.outputs.go == 'true'
        # golangci/golangci-lint-action@v9.2.0
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20
        with:
          version: v2.12.2

      - name: Build
        if: needs.changes.outputs.go == 'true'
        run: go build ./...

      - name: Test
        if: needs.changes.outputs.go == 'true'
        run: go test ./...

  mockup-syntax:
    # docs/design/mockups/*.jsx are acceptance specs. CI doesn't render
    # them, but esbuild parses each file so a hand-edit that breaks the
    # design-canvas viewer fails here rather than in a reviewer's
    # browser. esbuild's `--loader=jsx` is the cheapest JSX-aware parser
    # available; no node_modules install needed.
    name: Mockup JSX syntax
    needs: changes
    if: needs.changes.outputs.mockups == 'true'
    runs-on: [self-hosted, Linux]
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node
        # actions/setup-node@v4
        # Self-hosted runner has no Node by default; previous
        # `node --check` step also failed silently here. Pin to the
        # frontend's .nvmrc so all JS-touching jobs share one Node.
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version-file: frontend/.nvmrc
      - name: esbuild --loader=jsx on every mockup .jsx
        run: |
          set -euo pipefail
          for f in docs/design/mockups/*.jsx; do
            npx --yes esbuild --loader:.jsx=jsx --log-level=warning "$f" > /dev/null \
              || { echo "::error file=$f::JSX syntax error"; exit 1; }
          done

  frontend:
    # Frontend typecheck + Vitest suite. Job-level path filter (via the
    # `changes` job) skips this when only Go/mockup/install.sh files
    # change, so a Go-only PR doesn't pay the npm-install cost.
    #
    # Deliberately does NOT run `npm run build` — the production
    # bundle goes through `make frontend` at release time
    # (release.yml), which also runs `go build` and proves
    # //go:embed picks it up. This job is the per-PR fast loop:
    # tsc + vitest, ~30s on a warm runner.
    name: Frontend test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node
        # actions/setup-node@v4
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck
        run: cd frontend && npm ci --silent && npm run typecheck

      - name: Test
        run: cd frontend && npm test
