name: static-check

on:
  pull_request:
    paths:
      - "scripts/e2e-milestone1.sh"
      - ".github/workflows/static-check.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/e2e-milestone1.sh"
      - ".github/workflows/static-check.yml"

permissions:
  contents: read

jobs:
  e2e-milestone1-shell:
    name: e2e-milestone1.sh syntax
    runs-on: [self-hosted, Linux]

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate e2e-milestone1.sh syntax
        run: bash -n scripts/e2e-milestone1.sh
