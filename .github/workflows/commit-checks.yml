name: Commit Checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-commits:
    name: Check commits
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          # Full history so the base..head range is resolvable.
          fetch-depth: 0

      - name: Check commit author, committer, and co-author fields
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/check-authorship.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Advisory GitHub Verified badge check (comment only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci/check-commit-verification.sh "$BASE_SHA" "$HEAD_SHA"
