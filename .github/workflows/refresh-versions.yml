name: Refresh Splice versions

# Weekly cron that asks GitHub "what Splice tags exist?" and, for each
# uncatalogued tag, runs scripts/add-splice-version.sh to compute its
# commit + ContentSHA + size, then opens a PR with the diff. Humans
# vet and merge.
#
# This eliminates the manual "edit versions.json by hand" step for
# routine version bumps. The script refuses to overwrite existing
# entries, so a force-pushed upstream tag is never silently swallowed
# (the dpm localnet versions command surfaces "drifted" status for
# those instead).

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Enumerate new upstream tags
        id: enum
        run: |
          set -euo pipefail
          # Hit the same endpoint the runtime does. Compare against the
          # catalogue to find tags worth adding.
          catalogued=$(python3 -c "import json;print(' '.join(v['tag'] for v in json.load(open('internal/splice/versions.json'))['versions']))")
          echo "Catalogued: $catalogued"
          all=$(curl -sSf "https://api.github.com/repos/canton-network/splice/tags?per_page=100" \
            | python3 -c "import json,sys;[print(t['name']) for t in json.load(sys.stdin)]")
          missing=()
          for t in $all; do
            # Skip pre-release / non-semver tags (e.g. next-cilr); the
            # maintainer script auto-detects N.N.N for the `major`
            # field and tags that don't match would land with major="".
            if [[ ! "$t" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then continue; fi
            if [[ " $catalogued " == *" $t "* ]]; then continue; fi
            missing+=("$t")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "Nothing new upstream."
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'New tags to consider: %s\n' "${missing[*]}"
          {
            echo "any=true"
            echo "tags<<EOF"
            printf '%s\n' "${missing[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add new tags via maintainer script
        if: steps.enum.outputs.any == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "::group::Adding $tag"
            scripts/add-splice-version.sh "$tag" || echo "warning: failed to add $tag (continuing)"
            echo "::endgroup::"
          done <<< "${{ steps.enum.outputs.tags }}"

      - name: Open PR with catalogue updates
        if: steps.enum.outputs.any == 'true'
        # peter-evans/create-pull-request@v6
        uses: peter-evans/create-pull-request@5b4a9f6a9e2af26e5f02351490b90d01eb8ec1e5
        with:
          commit-message: "chore: catalogue new Splice versions"
          branch: chore/refresh-splice-versions
          title: "chore: catalogue new Splice versions"
          body: |
            Auto-generated by `.github/workflows/refresh-versions.yml`.

            New Splice tags discovered upstream and added to
            `internal/splice/versions.json`:

            ```
            ${{ steps.enum.outputs.tags }}
            ```

            Each entry was added by `scripts/add-splice-version.sh`, which:
            1. Resolves the tag → commit SHA via the GitHub REST API.
            2. Downloads the source archive at that commit.
            3. Computes the deterministic ContentSHA of the extracted
               `cluster/compose/localnet/` subtree.

            **Reviewer checklist:**
            - [ ] Confirm each new tag corresponds to a release we want
                  to support (not a pre-release artifact).
            - [ ] Bump `latest_alias` in `versions.json` if the newest
                  catalogued tag should be the default `latest`.
            - [ ] Consider scheduling an integration run against the
                  newest entry before merging.
          delete-branch: true
