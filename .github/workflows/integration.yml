name: Integration

# Long-running end-to-end test: brings up a real Splice LocalNet,
# verifies status/creds/down. Takes 5-30 minutes.
# Deliberately kept off the every-PR path:
#
#   - schedule: nightly at 03:00 UTC against main.
#   - workflow_dispatch: manual trigger for ad-hoc validation.
#   - pull_request: only when the PR carries the `run-integration`
#     label (apply via PR review UI).
#
# Tagged build tag: integration. Unit tests are unaffected (`go test
# ./...` continues to skip this file).
#
# Platform: Linux only (self-hosted Proxmox e2e runner).
# Windows is disabled — GitHub-hosted runners lack reliable Docker.
# macOS is also excluded; GitHub's macos-latest runners do not ship
# Docker. Local macOS dev validates via `scripts/run-integration.sh`.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  integration:
    name: integration
    # Only run when the trigger is the scheduled cron / manual /
    # explicitly-labeled PR. Synchronize fires on every push to a
    # labeled PR; we still gate on the label being present.
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-integration'))
    runs-on: [self-hosted, Linux, X64, proxmox, e2e]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Docker daemon
        run: |
          docker version
          docker compose version

      - name: Run integration tests
        run: go test -tags=integration -timeout=40m -v ./internal/localnet/...

      - name: Dump container + compose state on failure
        if: failure()
        run: |
          docker ps -a
          docker compose ls
