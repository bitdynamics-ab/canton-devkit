name: E2E: DPM Installation

# Weekly read-only detective check that the published DPM component at
# ghcr.io/bitdynamics-ab/canton-devkit is genuinely PUBLIC and usable.
#
# It proves three things:
#   1. Anonymously pullable from GHCR (the package is really Public).
#   2. Multi-arch in metadata — the OCI index advertises all three release
#      platforms (linux/amd64, darwin/arm64, windows/amd64).
#   3. Installable + runnable on linux/amd64 — `dpm install package`
#      succeeds and `dpm localnet --help` runs the installed binary.
#
# A failed run means a regression: the package was flipped private, a
# release broke the artifact, or a platform is missing from the index.
#
# Triggers:
#   - schedule: Mondays 05:00 UTC. Offset from e2e (04:00),
#     integration (03:00), and refresh-versions (Mon 06:00).
#   - workflow_dispatch: manual trigger; optional `version` input.
#
# Platform: Linux/amd64 only (self-hosted Proxmox e2e runner). Functional
# execution tests linux/amd64 only; the other two platforms are verified
# at index-metadata level (reading the OCI index JSON), not by running
# their binaries.
#
# Anonymity: the curl steps use only the self-fetched public pull token;
# dpm uses its own auth config (not Docker credentials) and has no login
# config for GHCR on this runner by default.
#
# Audit/compliance: read-only detective control monitoring intentional
# public exposure of the package (ISO 27001 / Vanta evidence). Introduces
# no credentials and no write scopes.
#
# Maintenance:
#   - DPM_VERSION / DPM_LINUX_SHA256 are duplicated from release.yml.
#     Bump them together. Keep in sync with release.yml.
#   - The platform list in "Multi-arch metadata assertion" mirrors
#     RELEASE_TARGETS in release.yml — keep in sync.
#   - NS is hard-coded to bitdynamics-ab/canton-devkit.
#     Update if the org/repo moves.

on:
  schedule:
    - cron: "0 5 * * 1" # Mon 05:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "OCI tag to verify (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: read # read-only detective check — no packages:write

jobs:
  verify:
    name: e2e-test-dpm-installation
    runs-on: [self-hosted, Linux, X64, proxmox, e2e]
    timeout-minutes: 20
    env:
      NS: bitdynamics-ab/canton-devkit
      # Keep DPM_VERSION / DPM_LINUX_SHA256 in sync with release.yml.
      DPM_VERSION: "1.0.16"
      DPM_LINUX_SHA256: "387421d4b3d0e799f05cde1f5c2adc704acd2824796d436861602eb2be759874"

    steps:
      - name: Resolve version
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version || 'latest' }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Anonymous registry fetch (raw v2 API)
        run: |
          set -euo pipefail
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${NS}:pull" | jq -r .token)
          code=$(curl -sS -o manifest.json -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${NS}/manifests/${VERSION}")
          test "$code" = "200" || {
            echo "::error::GHCR returned HTTP ${code} anonymously for ${NS}:${VERSION} — package may be private"
            exit 1
          }
          # Extract the strict semver from the manifest annotations.
          # dpm install package requires a strict semver OCI tag; symbolic
          # tags like "latest" are rejected. org.opencontainers.image.version
          # is always present in our published manifests (set by dpm publish).
          INSTALL_VERSION=$(jq -r '.annotations["org.opencontainers.image.version"]' manifest.json)
          echo "INSTALL_VERSION=${INSTALL_VERSION}" >> "$GITHUB_ENV"

      - name: Multi-arch metadata assertion
        run: |
          set -euo pipefail
          # Platform list mirrors RELEASE_TARGETS in release.yml.
          for plat in linux/amd64 darwin/arm64 windows/amd64; do
            os="${plat%/*}"; arch="${plat#*/}"
            jq -e --arg os "$os" --arg arch "$arch" \
              '.manifests[]?.platform | select(.os==$os and .architecture==$arch)' manifest.json > /dev/null \
              || {
                echo "::error::OCI index for ${NS}:${VERSION} is missing platform ${plat}"
                exit 1
              }
          done

      - name: Install DPM CLI (sha256-verified)
        run: |
          set -euo pipefail
          tar="${RUNNER_TEMP}/dpm-${DPM_VERSION}-linux-amd64.tar.gz"
          curl -sSfL \
            "https://github.com/digital-asset/dpm/releases/download/${DPM_VERSION}/dpm-${DPM_VERSION}-linux-amd64.tar.gz" \
            -o "$tar"
          echo "${DPM_LINUX_SHA256}  ${tar}" | sha256sum --check --strict -
          bindir="${RUNNER_TEMP}/dpm-bin"
          mkdir -p "$bindir"
          tar -xzf "$tar" -C "$bindir" dpm
          chmod 0755 "$bindir/dpm"
          echo "$bindir" >> "$GITHUB_PATH"
          # Use absolute path — $GITHUB_PATH additions only take effect in
          # subsequent steps, not in the same step where the echo is done.
          "$bindir/dpm" --version

      - name: Anonymous install + smoke test (linux/amd64)
        run: |
          set -euo pipefail
          # dpm install package reads daml.yaml from the current directory.
          # Create a minimal project file — no sdk-version (which would pull
          # in the SDK bundle and conflict with opt-in components), just the
          # component reference with the resolved strict semver tag.
          workdir="${RUNNER_TEMP}/dpm-verify"
          mkdir -p "$workdir"
          cat > "$workdir/daml.yaml" <<EOF
          name: oci-verify
          version: 0.1.0
          source: .
          dependencies: []
          components:
            - oci://ghcr.io/${NS}:${INSTALL_VERSION}
          EOF
          cd "$workdir"
          dpm install package
          # success ⇒ linux/amd64 binary resolved, downloaded, registered, executable
          dpm localnet --help

      - name: Cleanup
        if: always()
        run: rm -f manifest.json
