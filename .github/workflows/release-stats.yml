name: Refresh release download stats

# Daily cron (+ manual dispatch, + after a Release run) that regenerates
# the download-stats charts/tables embedded in README.md via
# scripts/release-stats.sh, and opens a PR with the diff if the numbers
# changed. Mirrors the refresh-versions.yml pattern: automation proposes,
# a human merges — no bot ever pushes straight to main.
#
# Metric + charts are described in scripts/release-stats.sh; the
# underlying approach mirrors https://github.com/RamiAwar/gh-release-stats
# (sum GitHub release-asset download_count), reimplemented as static SVG
# since README markdown can't run that tool's client-side JS.

on:
  schedule:
    - cron: "23 6 * * *"   # daily 06:23 UTC
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Regenerate release-stats charts and tables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-stats.sh

      - name: Check for changes
        id: diff
        run: |
          set -euo pipefail
          git add docs/assets
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated stats
        if: steps.diff.outputs.changed == 'true'
        # peter-evans/create-pull-request@v6
        uses: peter-evans/create-pull-request@5b4a9f6a9e2af26e5f02351490b90d01eb8ec1e5
        with:
          commit-message: "chore: refresh release download stats"
          branch: chore/refresh-release-stats
          title: "chore: refresh release download stats"
          body: |
            Auto-generated by `.github/workflows/release-stats.yml`.

            Regenerates `docs/assets/release-downloads*` from the
            current `bitdynamics-ab/homebrew-canton-devkit` release
            assets via `scripts/release-stats.sh`.
          delete-branch: true
