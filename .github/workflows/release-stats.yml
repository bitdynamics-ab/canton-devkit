name: Release stats

# Regenerate the release download-statistics charts embedded in the README.
# Data source is the public builds repo (bitdynamics-ab/homebrew-canton-devkit),
# which mirrors the same release assets as this repo. Uses the built-in
# GITHUB_TOKEN only — no additional secrets required.
#
# Generated files are published to the `release-stats-data` branch (not
# `main`) and the README embeds them via raw.githubusercontent.com URLs,
# because the `main` branch ruleset requires all changes to go through a
# pull request and this bot commit can't satisfy that.

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:17 UTC (off-peak; avoids the top-of-hour cron surge).
    - cron: "17 6 * * *"
  workflow_run:
    # Refresh promptly after a release publishes new assets.
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-stats
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate download-stats charts
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout@v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Generate charts + append daily snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-stats.sh

      - name: Publish charts + snapshot to release-stats-data branch
        run: |
          set -euo pipefail
          files=(
            docs/assets/release-downloads-by-platform.svg
            docs/assets/release-downloads-by-version.svg
            docs/assets/release-downloads-totals.svg
            docs/assets/release-downloads.md
            docs/assets/release-downloads-history.jsonl
          )

          # Stash the freshly generated files before switching branches —
          # release-stats-data's tree is unrelated to main's, and main's
          # working copy of these files (modified in place by the generator)
          # must be reset or the branch switch below will refuse to proceed.
          tmp="$(mktemp -d)"
          for f in "${files[@]}"; do
            mkdir -p "${tmp}/$(dirname "${f}")"
            cp "${f}" "${tmp}/${f}"
          done
          git checkout -- "${files[@]}"

          if git fetch origin release-stats-data:refs/remotes/origin/release-stats-data; then
            git checkout -B release-stats-data refs/remotes/origin/release-stats-data
          else
            git checkout --orphan release-stats-data
            git reset --hard
          fi

          for f in "${files[@]}"; do
            cp "${tmp}/${f}" "${f}"
          done

          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "Release stats already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh release download stats"
          git push origin release-stats-data
