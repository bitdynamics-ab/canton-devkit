name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  # GHCR namespace for both standalone-binary releases and the
  # DPM-component OCI artifact.
  GHCR_NAMESPACE: ghcr.io/${{ github.repository }}
  # DPM CLI version pinned for reproducible publishes. Bump deliberately
  # — see https://github.com/digital-asset/dpm/releases. The companion
  # DPM_LINUX_SHA256 below pins the linux-amd64 tarball used to install
  # the CLI in CI; recompute via:
  #   curl -sL <release-tarball-url> | sha256sum
  DPM_VERSION: 1.0.16
  DPM_LINUX_SHA256: 387421d4b3d0e799f05cde1f5c2adc704acd2824796d436861602eb2be759874
  # Build matrix (single source of truth — kept in sync between the
  # standalone-binary and DPM-component jobs).
  RELEASE_TARGETS: linux/amd64 darwin/arm64 windows/amd64

jobs:
  binaries:
    name: Build standalone binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          # Module + build cache on (setup-go default). This is the only
          # Go-compiling job now — the dpm-component job consumes the
          # binaries this job uploads, so the toolchain runs exactly once.

      - name: Set up Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Web UI bundle
        # Produce the Vite production bundle into internal/ui/dist/ BEFORE
        # `go build`, so //go:embed all:dist embeds a working Web UI. Without
        # this the binaries ship only the committed index.html (which points
        # at gitignored, unbuilt /assets/*.js) → `localnet ui` is a blank
        # page. (vite build.outDir = ../internal/ui/dist.)
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build
          test -d ../internal/ui/dist/assets   # fail loudly if the bundle is missing

      - name: Set release metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
            # Reject a non-semver tag (e.g. v0.7) up front, before any
            # release or asset is created — the DPM-component job would
            # fail on it later anyway (invalid OCI semver). Keep the two
            # jobs' tag contract identical.
            semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if [[ ! "${version#v}" =~ $semver_re ]]; then
              echo "::error::Release tag '${version}' is not full semver. Tag a MAJOR.MINOR.PATCH release, e.g. v0.7.1 (not v0.7)." >&2
              exit 1
            fi
          else
            version="main-${short_sha}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build release binaries + tarballs + checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          # Short commit SHA, baked into release binaries so `version`
          # reports `<version> (<commit>)`. -trimpath strips VCS stamping,
          # so the binary can't recover this from debug.ReadBuildInfo() —
          # inject it explicitly.
          COMMIT: ${{ github.sha }}
          # Telemetry collector URL, baked into release binaries. Set the
          # repo variable TELEMETRY_ENDPOINT to enable sending; when unset
          # it stays empty and events are spooled locally only.
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}
        run: |
          set -euo pipefail
          mkdir -p dist component-bin
          short_commit="${COMMIT::7}"
          tel_pkg="github.com/bitdynamics-ab/canton-devkit/internal/telemetry"
          # Tag builds are the stable release channel.
          # Iterate the target matrix as a real array so each element is
          # quoted (tidier than relying on unquoted word-splitting).
          read -ra targets <<< "${RELEASE_TARGETS}"
          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"

            binary_name="canton-devkit"
            [ "$os" = "windows" ] && binary_name="canton-devkit.exe"

            # Build ONCE into component-bin/<os>_<arch>/. The dpm-component
            # job downloads this exact binary, so GitHub Releases and the
            # GHCR OCI artifact ship byte-identical bits (no rebuild skew).
            # -trimpath strips the runner's local paths from the binary;
            # -s -w shrink it ~30%.
            bindir="component-bin/${os}_${arch}"
            mkdir -p "${bindir}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${short_commit} -X main.channel=stable -X ${tel_pkg}.endpoint=${TELEMETRY_ENDPOINT}" \
              -o "${bindir}/${binary_name}" ./cmd/canton-devkit

            # Stage the standalone archive: binary + LICENSE + README for
            # end-user discoverability.
            stage="dist/stage_${os}_${arch}"
            mkdir -p "${stage}"
            cp "${bindir}/${binary_name}" "${stage}/${binary_name}"
            cp LICENSE "${stage}/LICENSE"
            cp README.md "${stage}/README.md"

            archive_base="canton-devkit_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd "${stage}" && zip -q -r "../${archive_base}.zip" .)
            else
              tar -C "${stage}" -czf "dist/${archive_base}.tar.gz" .
            fi
            rm -rf "${stage}"
          done

          # Single SHA256SUMS file covers every published archive (dist/
          # now holds only the tarballs/zips). Format is GNU sha256sum
          # compatible so users can verify via:
          #   sha256sum --check SHA256SUMS
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload raw binaries for the DPM-component job
        # Unconditional: the dpm-component job needs these on every run
        # (it dry-runs on main and publishes on tags). upload-artifact
        # does NOT preserve the executable bit — the consumer re-chmods.
        # On main, a full org-wide Actions artifact quota (recalculated
        # only every 6-12h and driven by OTHER repos in the org) must not
        # fail the build — the binaries are already built + tested, and the
        # downstream dpm-component job only dry-runs. On a release tag this
        # stays fatal: a real release must ship its binaries.
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: component-binaries
          path: component-bin/**
          retention-days: 1

      - name: Upload main branch artifacts
        if: github.ref == 'refs/heads/main'
        # Convenience downloads of each main build — never worth failing
        # the build over when the org-wide artifact quota is full.
        continue-on-error: true
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canton-devkit-${{ steps.meta.outputs.version }}
          path: dist/*
          # Cap retention: these are convenience downloads of each main
          # build. Without a limit they default to 90 days and accumulate
          # (one ~20 MB set per push) until the Actions artifact storage
          # quota fills and EVERY upload — including the component-binaries
          # the dpm-component job depends on — starts failing.
          retention-days: 7

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        # softprops/action-gh-release@v3
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          generate_release_notes: true
          files: dist/*

      - name: Publish to public builds repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Fetch release notes from the primary release just created above.
          # Use GITHUB_TOKEN (not BUILDS_REPO_TOKEN) to read from this repo.
          notes=$(GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')

          gh release create "${VERSION}" \
            --repo bitdynamics-ab/homebrew-canton-devkit \
            --title "${VERSION}" \
            --notes "${notes}" \
            dist/*

      - name: Update Homebrew formula in public builds repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # SHA256SUMS lives at dist/SHA256SUMS — tarballs land directly
          # in dist/ and the checksum file uses GNU sha256sum format.
          # Filenames stay the same so the regex anchors still match.
          sha_darwin=$(grep "_${VERSION}_darwin_arm64.tar.gz$" dist/SHA256SUMS | awk '{print $1}')
          sha_linux=$(grep "_${VERSION}_linux_amd64.tar.gz$" dist/SHA256SUMS | awk '{print $1}')
          version_num="${VERSION#v}"

          # Fetch current formula from the public builds repo
          gh api repos/bitdynamics-ab/homebrew-canton-devkit/contents/Formula/canton-devkit.rb \
            --jq '.content' | base64 -d > /tmp/canton-devkit.rb

          # Rewrite version and sha256 fields
          awk -v ver="$version_num" -v sd="$sha_darwin" -v sl="$sha_linux" '
            BEGIN { seen_sha = 0 }
            /^  version / { sub(/"[^"]*"/, "\"" ver "\""); print; next }
            /^      sha256 / {
              seen_sha++
              if (seen_sha == 1)      sub(/"[^"]*"/, "\"" sd "\"")
              else if (seen_sha == 2) sub(/"[^"]*"/, "\"" sl "\"")
              print; next
            }
            { print }
          ' /tmp/canton-devkit.rb > /tmp/canton-devkit-updated.rb

          # Commit updated formula via the GitHub API
          file_sha=$(gh api repos/bitdynamics-ab/homebrew-canton-devkit/contents/Formula/canton-devkit.rb --jq '.sha')
          updated_content=$(base64 -w0 < /tmp/canton-devkit-updated.rb)

          gh api --method PUT repos/bitdynamics-ab/homebrew-canton-devkit/contents/Formula/canton-devkit.rb \
            -f message="chore: bump Homebrew formula to ${VERSION}" \
            -f content="$updated_content" \
            -f sha="$file_sha" \
            -f branch="main"

  dpm-component:
    name: Publish DPM component to GHCR
    # Consumes the binaries built by `binaries` (no second Go build) so
    # the OCI artifact and the GitHub Release ship identical bits and CI
    # compiles Go exactly once.
    needs: binaries
    runs-on: ubuntu-latest
    # On main this is a publish DRY-RUN (push=false). If the upstream
    # component-binaries upload was skipped because the org-wide artifact
    # quota is full, the download here can't succeed — don't let that fail
    # the workflow on main. On a release tag it stays fatal (real publish).
    continue-on-error: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Download prebuilt binaries
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: component-binaries
          path: component-bin

      - name: Set release metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # DPM expects a full MAJOR.MINOR.PATCH semver string for the OCI
            # tag — strip the `v` prefix. A 2-part tag like `v0.7` strips to
            # `0.7`, which DPM's `publish component` rejects as invalid
            # semver (this is exactly what broke the v0.7 release). Fail
            # FAST here with an actionable message rather than letting the
            # cryptic dpm usage dump surface three steps later.
            version="${GITHUB_REF_NAME#v}"
            semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if [[ ! "${version}" =~ $semver_re ]]; then
              echo "::error::Release tag '${GITHUB_REF_NAME}' is not full semver. Tag a MAJOR.MINOR.PATCH release, e.g. v0.7.1 (not v0.7)." >&2
              exit 1
            fi
            push="true"
          else
            version="0.0.0-${short_sha}"
            push="false"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "push=${push}" >> "${GITHUB_OUTPUT}"

      - name: Install DPM CLI (sha256-verified)
        run: |
          set -euo pipefail
          tar="/tmp/dpm-${DPM_VERSION}-linux-amd64.tar.gz"
          curl -sSfL \
            "https://github.com/digital-asset/dpm/releases/download/${DPM_VERSION}/dpm-${DPM_VERSION}-linux-amd64.tar.gz" \
            -o "$tar"
          echo "${DPM_LINUX_SHA256}  ${tar}" | sha256sum --check --strict -
          tar -xzf "$tar" -C /usr/local/bin dpm
          dpm --version

      - name: Lay out per-platform component dirs
        run: |
          set -euo pipefail
          # Mirror the layout dpm publish component expects:
          #   <dir>/component.yaml
          #   <dir>/LICENSE
          #   <dir>/bin/canton-devkit[.exe]
          #
          # DPM does NOT auto-append `.exe` on Windows — it stat()s the
          # exact path in component.yaml. We therefore template the
          # manifest per platform: Unix uses bin/canton-devkit; Windows
          # gets bin/canton-devkit.exe. (Empirically verified against
          # DPM 1.0.16.)
          read -ra targets <<< "${RELEASE_TARGETS}"
          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            dir="dist/component_${os}_${arch}"
            mkdir -p "${dir}/bin"
            cp LICENSE "${dir}/LICENSE"

            binary_name="canton-devkit"
            [ "$os" = "windows" ] && binary_name="canton-devkit.exe"

            # Copy the prebuilt binary and restore the executable bit
            # (upload/download-artifact drops file permissions).
            cp "component-bin/${os}_${arch}/${binary_name}" "${dir}/bin/${binary_name}"
            chmod +x "${dir}/bin/${binary_name}"

            # Substitute the binary path token in the manifest template.
            sed "s|@@BINARY_PATH@@|bin/${binary_name}|" \
              packaging/component.yaml.tmpl > "${dir}/component.yaml"
          done
          ls -R dist

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        # docker/login-action@v4
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate component manifest (dry-run)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          dpm publish component \
            "oci://${GHCR_NAMESPACE}:${VERSION}" \
            --dry-run \
            --platform linux/amd64=dist/component_linux_amd64 \
            --platform darwin/arm64=dist/component_darwin_arm64 \
            --platform windows/amd64=dist/component_windows_amd64

      - name: Publish DPM component (tag pushes only)
        if: steps.meta.outputs.push == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Only move the `latest` tag for FINAL releases. A pre-release
          # (v1.2.0-rc1) or a hotfix tagged against an older line must not
          # clobber `latest`. Semver pre-releases carry a `-` in the
          # build metadata; gate on its absence.
          extra_tags=()
          case "${VERSION}" in
            *-*) echo "pre-release ${VERSION} — leaving 'latest' untouched" ;;
            *)   extra_tags+=(--extra-tags latest) ;;
          esac
          # ${arr[@]+"${arr[@]}"} expands to nothing when the array is
          # empty WITHOUT tripping `set -u` (portable across bash 3.2+),
          # so a pre-release publishes with no extra args rather than a
          # stray empty argument.
          dpm publish component \
            "oci://${GHCR_NAMESPACE}:${VERSION}" \
            --include-git-info \
            ${extra_tags[@]+"${extra_tags[@]}"} \
            --platform linux/amd64=dist/component_linux_amd64 \
            --platform darwin/arm64=dist/component_darwin_arm64 \
            --platform windows/amd64=dist/component_windows_amd64
