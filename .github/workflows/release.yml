name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  # packages: write — no longer needed; OCI publish moved to homebrew-canton-devkit

env:
  # TODO: OCI publish has moved to homebrew-canton-devkit (the public
  # distribution repo) so that the DPM component is published under a
  # public GHCR namespace. Re-enable here once we have an OCI registry
  # we can push to directly from this (private) repo.
  # See: https://github.com/bitdynamics-ab/homebrew-canton-devkit
  #
  # GHCR_NAMESPACE: ghcr.io/${{ github.repository }}
  # DPM_VERSION: 1.0.16
  # DPM_LINUX_SHA256: 387421d4b3d0e799f05cde1f5c2adc704acd2824796d436861602eb2be759874
  # Build matrix: shared by the standalone-binary archives.
  RELEASE_TARGETS: linux/amd64 darwin/arm64 windows/amd64

jobs:
  release:
    name: Build binaries + publish DPM component
    # Single job so the standalone binaries and the DPM-component OCI
    # artifact are built from ONE Go compile and handed off via local
    # disk — no upload/download-artifact, so the workflow consumes ZERO
    # GitHub Actions artifact-storage quota. Runs on the self-hosted
    # runner to keep compute off GitHub-hosted minutes too.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          # No setup-go cache on the self-hosted runner (matches the other
          # self-hosted workflows). Go compiles exactly once here — the DPM
          # component is packaged from these same binaries via local disk.
          cache: false

      - name: Set up Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Web UI bundle
        # Produce the Vite production bundle into internal/ui/dist/ BEFORE
        # `go build`, so //go:embed all:dist embeds a working Web UI. Without
        # this the binaries ship only the committed index.html (which points
        # at gitignored, unbuilt /assets/*.js) → `localnet ui` is a blank
        # page. (vite build.outDir = ../internal/ui/dist.)
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build
          test -d ../internal/ui/dist/assets   # fail loudly if the bundle is missing

      - name: Set release metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          # Three distinct versions flow through this workflow:
          #   devkit_version    — the DevKit release, v-prefixed (v0.7.1).
          #                       Used for GitHub Releases, tarball names,
          #                       and the Homebrew formula.
          #   component_version — the SAME DevKit version in bare semver
          #                       (0.7.1) for the DPM component's OCI tag.
          #   DPM_VERSION (env) — the pinned DPM *CLI* version (unrelated).
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Reject a non-semver tag (e.g. v0.7) up front, before any
            # release or asset is created. DPM's `publish component`
            # requires a full MAJOR.MINOR.PATCH OCI tag, so a 2-part tag
            # like v0.7 (which stripped to 0.7) is exactly what broke the
            # v0.7 release. Fail FAST here with an actionable message.
            devkit_version="${GITHUB_REF_NAME}"
            component_version="${GITHUB_REF_NAME#v}"
            semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if [[ ! "${component_version}" =~ $semver_re ]]; then
              echo "::error::Release tag '${devkit_version}' is not full semver. Tag a MAJOR.MINOR.PATCH release, e.g. v0.7.1 (not v0.7)." >&2
              exit 1
            fi
            push="true"
          else
            devkit_version="main-${short_sha}"
            # DPM needs a valid semver even for the dry-run on main.
            component_version="0.0.0-${short_sha}"
            push="false"
          fi
          echo "devkit_version=${devkit_version}" >> "${GITHUB_OUTPUT}"
          echo "component_version=${component_version}" >> "${GITHUB_OUTPUT}"
          echo "push=${push}" >> "${GITHUB_OUTPUT}"

      - name: Build release binaries + tarballs + checksums
        env:
          VERSION: ${{ steps.meta.outputs.devkit_version }}
          # Short commit SHA, baked into release binaries so `version`
          # reports `<version> (<commit>)`. -trimpath strips VCS stamping,
          # so the binary can't recover this from debug.ReadBuildInfo() —
          # inject it explicitly.
          COMMIT: ${{ github.sha }}
          # Telemetry collector URL, baked into release binaries. Set the
          # repo variable TELEMETRY_ENDPOINT to enable sending; when unset
          # it stays empty and events are spooled locally only.
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}
        run: |
          set -euo pipefail
          mkdir -p dist component-bin
          short_commit="${COMMIT::7}"
          tel_pkg="github.com/bitdynamics-ab/canton-devkit/internal/telemetry"
          # Tag builds are the stable release channel.
          # Iterate the target matrix as a real array so each element is
          # quoted (tidier than relying on unquoted word-splitting).
          read -ra targets <<< "${RELEASE_TARGETS}"
          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"

            binary_name="canton-devkit"
            [ "$os" = "windows" ] && binary_name="canton-devkit.exe"

            # Build ONCE into component-bin/<os>_<arch>/. The DPM-component
            # steps later in this job package this exact binary, so GitHub
            # Releases and the GHCR OCI artifact ship byte-identical bits
            # (no rebuild skew). -trimpath strips the runner's local paths
            # from the binary; -s -w shrink it ~30%.
            bindir="component-bin/${os}_${arch}"
            mkdir -p "${bindir}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${short_commit} -X main.channel=stable -X ${tel_pkg}.endpoint=${TELEMETRY_ENDPOINT}" \
              -o "${bindir}/${binary_name}" ./cmd/canton-devkit

            # Stage the standalone archive: binary + LICENSE + README for
            # end-user discoverability.
            stage="dist/stage_${os}_${arch}"
            mkdir -p "${stage}"
            cp "${bindir}/${binary_name}" "${stage}/${binary_name}"
            cp LICENSE "${stage}/LICENSE"
            cp README.md "${stage}/README.md"

            archive_base="canton-devkit_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd "${stage}" && zip -q -r "../${archive_base}.zip" .)
            else
              tar -C "${stage}" -czf "dist/${archive_base}.tar.gz" .
            fi
            rm -rf "${stage}"
          done

          # Linux Debian package (.deb) for Ubuntu/Debian users. This is
          # also fed into the static APT repository in the public builds
          # repo below. It reuses the exact linux/amd64 binary built above,
          # preserving the "same binary across distribution surfaces"
          # invariant.
          if [[ "${VERSION}" == v* ]]; then
            deb_version="${VERSION#v}"
          else
            deb_version="0.0.0+${short_commit}"
          fi
          command -v ar >/dev/null
          command -v tar >/dev/null
          command -v gzip >/dev/null
          debwork="dist/debwork"
          debroot="${debwork}/data"
          debctrl="${debwork}/control"
          mkdir -p \
            "${debctrl}" \
            "${debroot}/usr/bin" \
            "${debroot}/usr/share/doc/canton-devkit"
          cp "component-bin/linux_amd64/canton-devkit" "${debroot}/usr/bin/canton-devkit"
          chmod 0755 "${debroot}/usr/bin/canton-devkit"
          cp LICENSE "${debroot}/usr/share/doc/canton-devkit/LICENSE"
          cp README.md "${debroot}/usr/share/doc/canton-devkit/README.md"
          cp packaging/deb/postinst "${debctrl}/postinst"
          chmod 0755 "${debctrl}/postinst"
          cat > "${debctrl}/control" <<EOF
          Package: canton-devkit
          Version: ${deb_version}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Bitdynamics <admin@bitdynamics.me>
          Homepage: https://github.com/bitdynamics-ab/canton-devkit
          Description: Canton DevKit LocalNet developer tooling
           Canton DevKit manages Canton LocalNet instances, DAR workflows,
           contract exploration, observability, and token testing from a
           single standalone CLI.
          EOF
          sed -i 's/^          //' "${debctrl}/control"
          printf '2.0\n' > "${debwork}/debian-binary"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "${debctrl}" -cf - . | gzip -n > "${debwork}/control.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C "${debroot}" -cf - . | gzip -n > "${debwork}/data.tar.gz"
          (
            cd "${debwork}"
            ar rcs "../canton-devkit_${deb_version}_amd64.deb" \
              debian-binary control.tar.gz data.tar.gz
          )
          ar t "dist/canton-devkit_${deb_version}_amd64.deb"
          rm -rf "${debwork}"

          # Single SHA256SUMS file covers every published archive (dist/
          # now holds only release artifacts). Format is GNU sha256sum
          # compatible so users can verify via:
          #   sha256sum --check SHA256SUMS
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        # softprops/action-gh-release@v3
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          generate_release_notes: true
          files: dist/*

      - name: Publish to public builds repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.devkit_version }}
        run: |
          # Fetch release notes from the primary release just created above.
          # Use GITHUB_TOKEN (not BUILDS_REPO_TOKEN) to read from this repo.
          notes=$(GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body')

          gh release create "${VERSION}" \
            --repo bitdynamics-ab/homebrew-canton-devkit \
            --title "${VERSION}" \
            --notes "${notes}" \
            dist/*

      - name: Update Homebrew formula in public builds repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.devkit_version }}
        run: |
          # SHA256SUMS lives at dist/SHA256SUMS — tarballs land directly
          # in dist/ and the checksum file uses GNU sha256sum format.
          # Filenames stay the same so the regex anchors still match.
          sha_darwin=$(grep "_${VERSION}_darwin_arm64.tar.gz$" dist/SHA256SUMS | awk '{print $1}')
          sha_linux=$(grep "_${VERSION}_linux_amd64.tar.gz$" dist/SHA256SUMS | awk '{print $1}')
          version_num="${VERSION#v}"

          # Fetch current formula from the public builds repo
          gh api repos/bitdynamics-ab/homebrew-canton-devkit/contents/Formula/canton-devkit.rb \
            --jq '.content' | base64 -d > /tmp/canton-devkit.rb

          # Rewrite version and sha256 fields
          awk -v ver="$version_num" -v sd="$sha_darwin" -v sl="$sha_linux" '
            BEGIN { seen_sha = 0 }
            /^  version / { sub(/"[^"]*"/, "\"" ver "\""); print; next }
            /^      sha256 / {
              seen_sha++
              if (seen_sha == 1)      sub(/"[^"]*"/, "\"" sd "\"")
              else if (seen_sha == 2) sub(/"[^"]*"/, "\"" sl "\"")
              print; next
            }
            { print }
          ' /tmp/canton-devkit.rb > /tmp/canton-devkit-updated.rb

          # Commit updated formula via the GitHub API
          file_sha=$(gh api repos/bitdynamics-ab/homebrew-canton-devkit/contents/Formula/canton-devkit.rb --jq '.sha')
          updated_content=$(base64 -w0 < /tmp/canton-devkit-updated.rb)

          gh api --method PUT repos/bitdynamics-ab/homebrew-canton-devkit/contents/Formula/canton-devkit.rb \
            -f message="chore: bump Homebrew formula to ${VERSION}" \
            -f content="$updated_content" \
            -f sha="$file_sha" \
            -f branch="main"

      - name: Update public APT repository in public builds repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.devkit_version }}
        run: |
          set -euo pipefail
          version_num="${VERSION#v}"
          deb_asset="dist/canton-devkit_${version_num}_amd64.deb"
          test -f "${deb_asset}"

          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          gh auth setup-git
          gh repo clone bitdynamics-ab/homebrew-canton-devkit "${work}/repo" -- --depth 1

          repo="${work}/repo"
          pool="${repo}/apt/pool/main/c/canton-devkit"
          pkgdir="${repo}/apt/dists/stable/main/binary-amd64"
          mkdir -p "${pool}" "${pkgdir}"
          cp "${deb_asset}" "${pool}/$(basename "${deb_asset}")"

          packages="${pkgdir}/Packages"
          : > "${packages}"
          while IFS= read -r -d '' deb; do
            rel="${deb#"${repo}/apt/"}"
            base="$(basename "${deb}")"
            pkg_ver="${base#canton-devkit_}"
            pkg_ver="${pkg_ver%_amd64.deb}"
            size="$(stat -c%s "${deb}")"
            md5="$(md5sum "${deb}" | awk '{print $1}')"
            sha1="$(sha1sum "${deb}" | awk '{print $1}')"
            sha256="$(sha256sum "${deb}" | awk '{print $1}')"
            cat >> "${packages}" <<EOF
          Package: canton-devkit
          Version: ${pkg_ver}
          Architecture: amd64
          Maintainer: Bitdynamics <admin@bitdynamics.me>
          Filename: ${rel}
          Size: ${size}
          MD5sum: ${md5}
          SHA1: ${sha1}
          SHA256: ${sha256}
          Section: devel
          Priority: optional
          Homepage: https://github.com/bitdynamics-ab/canton-devkit
          Description: Canton DevKit LocalNet developer tooling
           Canton DevKit manages Canton LocalNet instances, DAR workflows,
           contract exploration, observability, and token testing from a
           single standalone CLI.

          EOF
          done < <(find "${pool}" -type f -name 'canton-devkit_*_amd64.deb' -print0 | sort -z -V)
          sed -i 's/^          //' "${packages}"
          gzip -n -c "${packages}" > "${packages}.gz"

          release="${repo}/apt/dists/stable/Release"
          date_rfc="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          cat > "${release}" <<EOF
          Origin: Bitdynamics
          Label: Canton DevKit
          Suite: stable
          Codename: stable
          Date: ${date_rfc}
          Architectures: amd64
          Components: main
          Description: Canton DevKit APT repository
          EOF
          sed -i 's/^          //' "${release}"
          for algo in MD5Sum SHA1 SHA256; do
            printf '%s:\n' "${algo}" >> "${release}"
            for rel_meta in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
              meta_path="${repo}/apt/dists/stable/${rel_meta}"
              case "${algo}" in
                MD5Sum) sum="$(md5sum "${meta_path}" | awk '{print $1}')" ;;
                SHA1) sum="$(sha1sum "${meta_path}" | awk '{print $1}')" ;;
                SHA256) sum="$(sha256sum "${meta_path}" | awk '{print $1}')" ;;
              esac
              printf ' %s %16s %s\n' "${sum}" "$(stat -c%s "${meta_path}")" "${rel_meta}" >> "${release}"
            done
          done

          git -C "${repo}" status --short
          git -C "${repo}" add apt
          if git -C "${repo}" diff --cached --quiet; then
            echo "APT repo already up to date for ${VERSION}"
            exit 0
          fi
          git -C "${repo}" -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update APT repo for ${VERSION}"
          git -C "${repo}" push

      # TODO: OCI publish has moved to homebrew-canton-devkit (the public
      # distribution repo). The workflow there triggers on GitHub Release
      # creation, downloads these same tarballs, and publishes the DPM
      # component to ghcr.io/bitdynamics-ab/homebrew-canton-devkit:<ver>.
      # Re-enable these steps once we have a public OCI registry we can
