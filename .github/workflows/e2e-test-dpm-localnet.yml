name: "E2E: dpm localnet"

# Bats-based end-to-end tests for the DPM component surface
# (`dpm localnet …`). One job per test file so a failed case can be
# re-run without replaying the whole suite.
#
# The component under test is the binary built in this run: each test job
# builds the binary (make build), assembles a file-based component from
# it, and the test project installs it via a {name, path} reference. That
# keeps the suite hermetic (no OCI registry, no cross-job artifact) and
# exercises the PR's binary, not a released one.
#
# bats-core and its helper libraries (bats-support, bats-assert) are
# vendored as pinned git submodules under e2e-tests/, so checkout uses
# submodules: recursive.
#
# First test: DPM-DAR-001 -- `dpm localnet dar build-upload` inside a
# Daml project (regression for issue #230). It runs --build-only, so no
# LocalNet is required.
#
# Triggers:
#   - schedule: nightly at 04:30 UTC (offset from the 04:00 functions e2e
#     and 05:00 Mon dpm-installation checks).
#   - workflow_dispatch: manual trigger for ad-hoc validation.
#   - pull_request: only when the PR carries the `run-e2e` label, and
#     only when the PR touches non-doc paths (docs/website/Markdown are
#     ignored so label/synchronize on doc-only PRs does not queue jobs).
#
# Platform: Linux only (self-hosted Proxmox e2e runner). Run
# `make e2e-dpm` locally for macOS validation.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**.md"

permissions:
  contents: read

jobs:
  dpm-dar-001:
    name: DPM-DAR-001
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: [self-hosted, Linux, X64, proxmox, e2e]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          submodules: recursive

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - uses: ./.github/actions/e2e-dpm-test
        with:
          bats-file: dpm-dar-001.bats

  cleanup:
    name: cleanup
    needs:
      - dpm-dar-001
    if: |
      always() && !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         contains(github.event.pull_request.labels.*.name, 'run-e2e'))
      )
    runs-on: [self-hosted, Linux, X64, proxmox, e2e]
    timeout-minutes: 10
    steps:
      - name: Force cleanup
        run: |
          rm -rf .tmp/e2e-dpm .tmp/e2e-dpm-component 2>/dev/null || true
