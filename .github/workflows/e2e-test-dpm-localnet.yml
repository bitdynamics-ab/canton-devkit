name: "E2E: dpm localnet"

# Shell-based end-to-end tests for the DPM component surface
# (`dpm localnet …`). One job per test ID so a failed case can be re-run
# without replaying the whole suite (mirrors e2e-test-devkit-functions.yml).
#
# The component under test is the binary built in this run: each test job
# assembles a file-based component from that binary and the test project
# installs it via a {name, path} reference. That keeps the suite hermetic
# (no OCI registry) and exercises the PR's binary, not a released one.
#
# First test: DPM-DAR-001 -- `dpm localnet dar build-upload` inside a Daml
# project (regression for issue #230). It runs --build-only, so no
# LocalNet is required.
#
# Triggers:
#   - schedule: nightly at 04:30 UTC (offset from the 04:00 functions e2e
#     and 05:00 Mon dpm-installation checks).
#   - workflow_dispatch: manual trigger for ad-hoc validation.
#   - pull_request: only when the PR carries the `run-e2e` label.
#
# Platform: Linux only (self-hosted Proxmox e2e runner). Run
# COMPONENT_DIR=$(scripts/e2e/dpm-build-component.sh) scripts/e2e/dpm-run-all.sh
# locally for macOS validation.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  setup:
    name: setup
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: [self-hosted, Linux, X64, proxmox, e2e]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        # actions/setup-go@v6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false

      - name: Build binary
        run: make build

      - name: Upload built binary
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canton-devkit-binary
          path: bin/canton-devkit
          retention-days: 1

  dpm-dar-001:
    name: DPM-DAR-001
    needs: setup
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: [self-hosted, Linux, X64, proxmox, e2e]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: ./.github/actions/e2e-dpm-test
        with:
          script: dpm-dar-001.sh

  cleanup:
    name: cleanup
    needs:
      - dpm-dar-001
    if: |
      always() && !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         contains(github.event.pull_request.labels.*.name, 'run-e2e'))
      )
    runs-on: [self-hosted, Linux, X64, proxmox, e2e]
    timeout-minutes: 10
    steps:
      - name: Force cleanup
        run: |
          rm -rf .tmp/e2e-dpm .tmp/e2e-dpm-component 2>/dev/null || true
